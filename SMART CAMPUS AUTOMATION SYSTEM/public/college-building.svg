<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="building" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="800" height="500" fill="url(#sky)"/>
  
  <!-- Stars -->
  <circle cx="50" cy="30" r="1" fill="#94a3b8" opacity="0.6"/>
  <circle cx="150" cy="60" r="1.5" fill="#94a3b8" opacity="0.4"/>
  <circle cx="300" cy="20" r="1" fill="#94a3b8" opacity="0.7"/>
  <circle cx="450" cy="45" r="1.2" fill="#94a3b8" opacity="0.5"/>
  <circle cx="600" cy="25" r="1" fill="#94a3b8" opacity="0.6"/>
  <circle cx="700" cy="55" r="1.5" fill="#94a3b8" opacity="0.3"/>
  <circle cx="100" cy="80" r="0.8" fill="#cbd5e1" opacity="0.4"/>
  <circle cx="550" cy="70" r="0.8" fill="#cbd5e1" opacity="0.3"/>

  <!-- Ground -->
  <rect x="0" y="380" width="800" height="120" fill="#0f172a"/>
  <rect x="0" y="380" width="800" height="2" fill="#334155" opacity="0.5"/>

  <!-- Trees left -->
  <ellipse cx="60" cy="340" rx="30" ry="40" fill="#166534" opacity="0.7"/>
  <rect x="57" y="360" width="6" height="20" fill="#713f12" opacity="0.5"/>
  <ellipse cx="120" cy="350" rx="25" ry="35" fill="#15803d" opacity="0.6"/>
  <rect x="118" y="365" width="5" height="15" fill="#713f12" opacity="0.4"/>

  <!-- Trees right -->
  <ellipse cx="700" cy="345" rx="28" ry="38" fill="#166534" opacity="0.6"/>
  <rect x="697" y="362" width="6" height="18" fill="#713f12" opacity="0.4"/>
  <ellipse cx="750" cy="355" rx="22" ry="30" fill="#15803d" opacity="0.5"/>
  <rect x="748" y="368" width="5" height="12" fill="#713f12" opacity="0.3"/>

  <!-- ─── Main Building ─── -->
  <!-- Base -->
  <rect x="250" y="200" width="300" height="180" rx="4" fill="url(#building)"/>
  
  <!-- Roof -->
  <polygon points="240,200 400,140 560,200" fill="url(#roof)"/>
  <rect x="390" y="120" width="20" height="25" rx="2" fill="#1e40af"/>
  <circle cx="400" cy="115" r="8" fill="#f59e0b" filter="url(#glow)"/>
  
  <!-- Windows Row 1 -->
  <rect x="275" y="220" width="30" height="40" rx="2" fill="url(#glass)" stroke="#3b82f6" stroke-width="0.5" opacity="0.8"/>
  <rect x="325" y="220" width="30" height="40" rx="2" fill="url(#glass)" stroke="#3b82f6" stroke-width="0.5" opacity="0.8"/>
  <rect x="375" y="220" width="30" height="40" rx="2" fill="url(#glass)" stroke="#3b82f6" stroke-width="0.5" opacity="0.8"/>
  <rect x="425" y="220" width="30" height="40" rx="2" fill="url(#glass)" stroke="#3b82f6" stroke-width="0.5" opacity="0.8"/>
  <rect x="475" y="220" width="30" height="40" rx="2" fill="url(#glass)" stroke="#3b82f6" stroke-width="0.5" opacity="0.8"/>
  
  <!-- Windows Row 2 -->
  <rect x="275" y="280" width="30" height="40" rx="2" fill="url(#glass)" stroke="#6366f1" stroke-width="0.5" opacity="0.7"/>
  <rect x="325" y="280" width="30" height="40" rx="2" fill="url(#glass)" stroke="#6366f1" stroke-width="0.5" opacity="0.7"/>
  <rect x="375" y="280" width="30" height="40" rx="2" fill="url(#glass)" stroke="#6366f1" stroke-width="0.5" opacity="0.7"/>
  <rect x="425" y="280" width="30" height="40" rx="2" fill="url(#glass)" stroke="#6366f1" stroke-width="0.5" opacity="0.7"/>
  <rect x="475" y="280" width="30" height="40" rx="2" fill="url(#glass)" stroke="#6366f1" stroke-width="0.5" opacity="0.7"/>

  <!-- Main Entrance -->
  <rect x="370" y="330" width="60" height="50" rx="3" fill="#0f172a" stroke="#3b82f6" stroke-width="0.5"/>
  <rect x="385" y="325" width="30" height="8" rx="2" fill="#1e40af"/>
  
  <!-- Steps -->
  <rect x="365" y="380" width="70" height="5" rx="1" fill="#334155"/>
  <rect x="360" y="385" width="80" height="5" rx="1" fill="#475569"/>
  <rect x="355" y="390" width="90" height="5" rx="1" fill="#64748b" opacity="0.3"/>

  <!-- ─── Left Wing ─── -->
  <rect x="120" y="240" width="130" height="140" rx="3" fill="url(#building)"/>
  <rect x="130" y="255" width="25" height="30" rx="2" fill="url(#glass)" stroke="#3b82f6" stroke-width="0.5" opacity="0.7"/>
  <rect x="170" y="255" width="25" height="30" rx="2" fill="url(#glass)" stroke="#3b82f6" stroke-width="0.5" opacity="0.7"/>
  <rect x="210" y="255" width="25" height="30" rx="2" fill="url(#glass)" stroke="#3b82f6" stroke-width="0.5" opacity="0.7"/>
  <rect x="130" y="310" width="25" height="30" rx="2" fill="url(#glass)" stroke="#6366f1" stroke-width="0.5" opacity="0.6"/>
  <rect x="170" y="310" width="25" height="30" rx="2" fill="url(#glass)" stroke="#6366f1" stroke-width="0.5" opacity="0.6"/>
  <rect x="210" y="310" width="25" height="30" rx="2" fill="url(#glass)" stroke="#6366f1" stroke-width="0.5" opacity="0.6"/>
  <rect x="118" y="237" width="134" height="5" rx="1" fill="#1e3a8a"/>

  <!-- ─── Right Wing ─── -->
  <rect x="550" y="240" width="130" height="140" rx="3" fill="url(#building)"/>
  <rect x="560" y="255" width="25" height="30" rx="2" fill="url(#glass)" stroke="#3b82f6" stroke-width="0.5" opacity="0.7"/>
  <rect x="600" y="255" width="25" height="30" rx="2" fill="url(#glass)" stroke="#3b82f6" stroke-width="0.5" opacity="0.7"/>
  <rect x="640" y="255" width="25" height="30" rx="2" fill="url(#glass)" stroke="#3b82f6" stroke-width="0.5" opacity="0.7"/>
  <rect x="560" y="310" width="25" height="30" rx="2" fill="url(#glass)" stroke="#6366f1" stroke-width="0.5" opacity="0.6"/>
  <rect x="600" y="310" width="25" height="30" rx="2" fill="url(#glass)" stroke="#6366f1" stroke-width="0.5" opacity="0.6"/>
  <rect x="640" y="310" width="25" height="30" rx="2" fill="url(#glass)" stroke="#6366f1" stroke-width="0.5" opacity="0.6"/>
  <rect x="548" y="237" width="134" height="5" rx="1" fill="#1e3a8a"/>

  <!-- Pathway -->
  <rect x="380" y="395" width="40" height="105" fill="#334155" opacity="0.3"/>
  <rect x="375" y="395" width="50" height="105" fill="none" stroke="#475569" stroke-width="0.5" opacity="0.3"/>

  <!-- Vignan text on building -->
  <text x="400" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#94a3b8" letter-spacing="4">VIGNAN INSTITUTE</text>
</svg>
